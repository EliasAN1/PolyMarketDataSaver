[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmdsaver"
version = "0.1.0"
description = "Collect Polymarket BTC 5m UP/DOWN odds and exchange price ticks into SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
pmdsaver = "pmdsaver.__main__:main"
pmdsaver-ui = "pmdsaver.ui.__main__:main"
pmdsaver-backtest = "pmdsaver.backtest.__main__:main"
pmdsaver-merge = "pmdsaver.mergedb:main"
pmdsaver-backfill = "pmdsaver.backfill_outcomes:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pmdsaver = ["ui/static/*"]
