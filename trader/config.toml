# Match Strategy Lab. One FAK buy per 5m window when every enabled filter is true.

# Minutes from window open.
elapsed_from_min = 0.0
elapsed_to_min = 1.5

# Trigger band: chosen side's mid must *enter* [odds_min, odds_max] during the elapsed window
# (already inside at the first in-band tick does not count).
odds_min = 0.45
odds_max = 0.55

# Hard cap on the ask (separate from trigger). Lab fills at the ask on the sample
# where the mid enters the band; allow a few ticks of spread above odds_max.
fak_limit = 0.60

use_btc_distance = true
# Spot venue that stands in for BTC (Lab "BTC reference"): binance_spot | coinbase_spot | bybit_spot | median
btc_source = "binance_spot"
min_btc_away = 5
max_btc_away = 200

use_twap = true
use_venues = true
min_venues = 4
# Fresh turn only (zero tuned parameters): only buy when the trade side is
# opposite to the previous closed 5m BTC candle (side * prev_5m_delta <= 0).
use_fresh_turn = true
# Normalize USDT venues (Binance, Bybit, Futures) to USD by subtracting their
# trailing 60m basis vs 60s TWAP (restores DOWN signals when USDT trades at a premium).
normalize_basis = true
# 1-hour steamroller guard: skip counter-trend entries when the trailing 60m
# BTC move against our trade side exceeds this dollar cap (0 or omit = off).
max_counter_60m = 300

stake_usd = 50
min_seconds_left = 3
tick_size = "0.01"

# When to trade. Empty = all. Hours are the machine clock (Europe/Berlin, UTC+2).
# Weekdays are Sun=0 or Mon,Tue,... Markets: tokyo_open, london, wall, ...
hours = []
weekdays = []
sessions = ["wall", "tokyo_open", "london"]

# Local hours that buy the opposite of the signal. Empty = never.
invert_hours = []
